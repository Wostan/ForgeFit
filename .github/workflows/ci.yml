# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with: 
        dotnet-version: 9.0.x

    - name: Restore Dependencies
      run: dotnet restore src/ForgeFit.Api/ForgeFit.Api.csproj

    - name: Build Backend
      run: dotnet build src/ForgeFit.Api/ForgeFit.Api.csproj --no-restore -c Release

  build-maui-android:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui-android

    - name: Build MAUI (Android)
      run: dotnet build src/ForgeFit.MAUI/ForgeFit.MAUI.csproj -c Release -f net9.0-android --no-restore
